<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registre d'appel UNA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;min-height:100vh;color:#0b7a3b;background:#cfe6cc}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2)),url(/fond.jpg) center/cover no-repeat}
header{background:#0b7a3b;color:#fff;text-align:center;padding:18px 10px;font-size:clamp(20px,5vw,34px);font-weight:700;text-shadow:1px 1px 3px #0006}
main{max-width:560px;margin:24px auto;padding:0 14px}.card{background:transparent;color:#fff;text-shadow:0 1px 4px #000c;padding:22px 0}.item,.item *,button,input,select{text-shadow:none}
h2{text-align:center;text-decoration:underline;margin:0 0 18px}h3{margin:18px 0 8px}label{display:block;margin:12px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px;background:#e4e4e4;font-size:16px}
button{width:100%;margin-top:16px;padding:14px;background:#0b7a3b;color:#fff;border:0;font-size:16px;cursor:pointer;border-radius:4px}
button.big{padding:36px 10px;background:#fff;color:#0b7a3b;font-size:22px;font-weight:700;border-radius:10px;box-shadow:0 4px 14px #0003;margin-top:0}
button.sm{width:auto;margin:6px 6px 0 0;padding:6px 10px;font-size:13px}button.red{background:#b00020}
.r3{grid-template-columns:repeat(3,1fr)!important;gap:10px!important}.r3 .big{font-size:clamp(13px,3.8vw,22px);padding:30px 4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.grid .item{margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.err{color:#ffc2c2;font-weight:600;margin-top:12px;text-align:center}.msg{color:#fff;text-align:center;margin-bottom:8px}
.item{background:#fff;border:1px solid #ccc;border-radius:8px;padding:14px;margin-bottom:10px;color:#000;font-size:15px;cursor:pointer}.item.s{cursor:default}
video{width:100%;border-radius:8px;background:#000}.ok{width:140px;height:140px;border-radius:50%;background:#0a9d1a;margin:10px auto;position:relative}
.ok:after{content:"";position:absolute;left:44px;top:28px;width:34px;height:68px;border:solid #fff;border-width:0 14px 14px 0;transform:rotate(40deg)}
#qr{display:flex;justify-content:center;margin:14px auto;background:#fff;padding:14px;border-radius:10px;width:fit-content}.t{text-align:center;font-size:22px;font-weight:700}.lnk{background:none;color:#fff;text-shadow:0 1px 4px #000c;text-decoration:underline;margin-top:8px;padding:6px}.sub{text-align:center;color:#fff;margin-bottom:8px}
</style></head><body>
<header>REGISTRE D'APPEL UNA</header><main><div class="card" id="c"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),v=id=>$('#'+id).value;let T='',PR=null,DGR=null,DG=false,DM={},DL2=[],UEN='',LS=false,LD=[],LB='dmenu',timer,stream,DL=[],AD={};
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Erreur réseau'),{j});return j};
const stopCam=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};
const show=h=>{clearInterval(timer);stopCam();$('#c').innerHTML=h};
const err=e=>{const x=$('#e');if(x)x.textContent=e.message||e;else alert(e.message||e)};
const f=(id,l,t='text')=>`<label>${l}</label><input id="${id}" type="${t}" autocomplete="off">`;
const sel2=(id,l,o)=>`<label>${l}</label><select id="${id}">${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>`;
const sel=(id,l,o)=>`<label>${l}</label><select id="${id}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const bk=(fn,t='Retour')=>`<button class="lnk" onclick="${fn}()">${t}</button>`;
const go=fn=>async(...a)=>{try{await fn(...a)}catch(e){err(e)}};
const EN=()=>document.documentElement.lang==='en';
const csvq=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
const dl=(name,rows)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(csvq).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)};
const HD=()=>EN()?['Date','Start','End','Unit (UE)','Field','Level','I.P','Last name','First name(s)']:['Date','Début','Fin','UE','Filière','Niveau','I.P','Nom','Prénom(s)'];
const rowsOf=L=>[HD()].concat(L.flatMap(s=>s.present.length?s.present.map(p=>[s.date,s.debut,s.fin,s.ue,s.filiere,s.niveau,p.ip,p.nom,p.prenoms]):[[s.date,s.debut,s.fin,s.ue,s.filiere,s.niveau,'','','']]));
const fn=s=>`presences_${s.date.replace(/\//g,'-')}_${s.niveau}-${s.filiere}_${s.debut.replace(':','h')}.csv`;
const lab=d=>`${d.niveau} ${d.filiere} · ${d.debut}-${d.fin}`;

// ===== Accueil et étudiants =====
const home=()=>{T='';DG=false;show(`<div class="row r3"><button class="big" onclick="choice()">Etudiants</button><button class="big" onclick="dlogin()">Docteur</button><button class="big" onclick="dchoice()">Délégués</button></div>`)};
const choice=()=>show(`<div class="row"><button class="big" onclick="reg()">Inscription</button><button class="big" onclick="login()">Connexion</button></div>${bk('home')}`);
const reg=()=>{show(`<h2>Inscription</h2>${f('n','Nom :')}${f('p','Prénom(s) :')}${f('i','I.P :')}${f('k','Code :','password')}<button id="b">VALIDER</button><div class="err" id="e"></div>${bk('choice')}`);
$('#b').onclick=go(async()=>{await api('register',{nom:v('n'),prenoms:v('p'),ip:v('i'),code:v('k')});login('Inscription réussie, connectez-vous.')})};
const login=m=>{show(`<h2>Connexion</h2>${m?`<div class="msg">${m}</div>`:''}${f('i','I.P :')}${f('k','Code :','password')}<button id="b">VALIDER</button><div class="err" id="e"></div>${bk('choice')}`);
$('#b').onclick=go(async()=>{T=(await api('login',{ip:v('i'),code:v('k')})).token;scan()})};
const scan=(note,back)=>{show(`<h2>Scanner le QR code</h2>${note?`<div class="msg">${note}</div>`:''}<video id="v" playsinline muted></video><div class="err" id="e"></div>${f('m','Ou saisir le code affiché :')}<button id="b">VALIDER</button>${back?bk(back,'Retour au menu'):bk('home','Retour à l\'accueil')}`);
let busy=false;$('#m').setAttribute('inputmode','numeric');$('#b').onclick=go(async()=>{await api('scan',{qr:v('m')});ok()});
navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(s=>{stream=s;const vd=$('#v');vd.srcObject=s;vd.play();const cv=document.createElement('canvas'),x=cv.getContext('2d');
const tick=async()=>{if(!stream)return;if(vd.videoWidth&&!busy){cv.width=vd.videoWidth;cv.height=vd.videoHeight;x.drawImage(vd,0,0);const d=x.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height);
if(q){busy=true;try{await api('scan',{qr:q.data});ok();return}catch(e){err(e);setTimeout(()=>busy=false,2500)}}}requestAnimationFrame(tick)};tick()}).catch(()=>err('Caméra indisponible : saisissez le code manuellement.'))};
const ok=()=>{show(`<h2>Présence validée</h2><div class="ok"></div>`);if(DG)setTimeout(dgmenu,2500);else{T='';setTimeout(home,2500)}};

// ===== Docteur =====
const dlogin=()=>{show(`<h2>Connexion</h2>${f('k','Code :','password')}<button id="b">VALIDER</button><div class="err" id="e"></div>${bk('home')}`);
$('#b').onclick=go(async()=>{const r=await api('doctor',{code:v('k')});T=r.token;UEN=r.ue||'';LS=!!r.listes;r.role==='adm'?amenu():dmenu()})};
const dmenu=()=>show(`${UEN?`<div class="sub">UE : ${esc(UEN)}</div>`:''}<div class="row${LS?' r3':''}"><button class="big" onclick="ddate()">Faire l'appel</button><button class="big" onclick="dates()">Vérifier les présences</button>${LS?`<button class="big" onclick="lvlOpen(0)">Listes par niveau</button>`:''}</div>${bk('home','Déconnexion')}`);
const ddate=()=>{show(`<h2>Nouvel appel</h2>${f('d','Date : JJ/MM/AAAA')}<div class="row"><div>${f('h1','Début','time')}</div><div>${f('h2','Fin','time')}</div></div><div class="row"><div>${sel('fi','Filière',['MI','PC','SN'])}</div><div>${sel('ni','Niveau',['L1','L2','L3','M1','M2'])}</div></div><button id="b">VALIDER</button><div class="err" id="e"></div>${bk('dmenu')}`);
$('#d').value=new Date().toLocaleDateString('fr-FR');
$('#b').onclick=go(async()=>{const o={date:v('d'),debut:v('h1'),fin:v('h2'),filiere:v('fi'),niveau:v('ni')};let r;
try{r=await api('start',o)}catch(e){if(e.j&&e.j.exists&&confirm('Un appel identique existe déjà. En faire un nouveau ?'))r=await api('start',{...o,force:true});else throw e}qrview(r.id)})};
const qrview=id=>{show(`<h2>Scannez ce QR code</h2><div id="qr"></div><div class="sub">Code à saisir si le scan ne marche pas :</div><div class="t" id="cd" style="font-size:46px;letter-spacing:6px"></div><div class="t" id="t" style="margin-top:10px"></div>${bk('dmenu','Retour au menu')}`);let last='';
const poll=async()=>{try{const r=await api('qr?id='+id);if(!r.qr){dmenu();return}
if(r.qr!==last){last=r.qr;$('#qr').innerHTML='';$('#cd').textContent=r.code.slice(0,3)+' '+r.code.slice(3);new QRCode($('#qr'),{text:r.qr,width:280,height:280})}
const s=Math.ceil(r.left/1000);$('#t').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}catch(e){}};poll();timer=setInterval(poll,1000)};
const dates=go(async()=>{DL=await api('dates');const days=[...new Set(DL.map(d=>d.date))];
show(`<h2>Dates des appels</h2>${days.map(d=>`<div class="item" onclick="day('${d}')">${d} (${DL.filter(x=>x.date===d).length} appel(s))</div>`).join('')||'<p>Aucun appel enregistré.</p>'}<button onclick="dlAll()">Tout télécharger (CSV)</button>${bk('dmenu')}`)});
const dlAll=go(async()=>{const L=await api('export');dl('presences_'+UEN.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'_')+'.csv',rowsOf(L))});
const day=d=>show(`<h2>Appels du ${d}</h2>${DL.filter(x=>x.date===d).map(x=>`<div class="item" onclick="pres('${x.id}')">${lab(x)} (${x.n} présents)</div>`).join('')}${bk('dates')}`);
const pres=go(async id=>{const r=await api('presence?id='+id);PR=r;show(`<h2>Présents du ${r.date}</h2><div class="sub">${lab(r)}</div>${r.list.map(s=>`<div class="item s">IP ETUDIANT: ${esc(s.ip)} | NOM: ${esc(s.nom)} | PRENOM(S): ${esc(s.prenoms)}</div>`).join('')||'<p>Aucun présent.</p>'}<button onclick="dl(fn(PR),rowsOf([PR]))">Télécharger la liste (CSV)</button><button class="lnk" onclick="day('${r.date}')">Retour</button>`)});

// ===== Listes par niveau (Docteur : les appels de son UE ; Administrateur : toutes les UE) =====
const grp=d=>d.niveau+' '+d.filiere;
const lvlOpen=go(async adm=>{if(adm){await aload();LD=AD.sessions;LB='amenu'}else{LD=await api('lists');LB='dmenu'}lvl()});
const lvl=()=>{const g={};LD.forEach(s=>(g[grp(s)]=g[grp(s)]||[]).push(s));
show(`<h2>Listes par niveau</h2>${Object.keys(g).sort().map(k=>`<div class="item" onclick="lvlList('${k}')">${esc(k)} (${g[k].length} appel(s))</div>`).join('')||'<p>Aucun appel enregistré.</p>'}${bk(LB)}`)};
const lvlList=k=>{const S=LD.filter(s=>grp(s)===k),m={};S.forEach(s=>s.present.forEach(p=>{(m[p.ip]=m[p.ip]||{ip:p.ip,nom:p.nom,prenoms:p.prenoms,n:0}).n++}));
const L=Object.values(m).sort((a,b)=>a.nom.localeCompare(b.nom));
show(`<h2>${esc(k)}</h2><div class="sub">${S.length} appel(s)</div>${L.map(p=>`<div class="item" data-ip="${esc(p.ip)}" onclick="hist(this.dataset.ip,&quot;lvlList('${k}')&quot;)">IP ETUDIANT: ${esc(p.ip)} | NOM: ${esc(p.nom)} | PRENOM(S): ${esc(p.prenoms)}<br>${p.n} présence(s) sur ${S.length}</div>`).join('')||'<p>Aucun présent.</p>'}${bk('lvl')}`)};
const hist=(ip,back)=>{const A=LD.filter(s=>s.present.some(p=>p.ip===ip)).sort((a,b)=>b.start-a.start);
const p=(AD.students||[]).find(x=>x.ip===ip)||(A[0]&&A[0].present.find(x=>x.ip===ip))||{nom:ip,prenoms:''};
show(`<h2>${esc(p.nom)} ${esc(p.prenoms)}</h2><div class="sub">${esc(ip)} · ${A.length} présence(s)</div>${A.map(s=>`<div class="item s">${s.date} · ${esc(s.ue)} · ${lab(s)}</div>`).join('')||'<p>Aucune présence.</p>'}<button class="lnk" onclick="${back}">Retour</button>`)};
const eHist=i=>{LD=AD.sessions;hist(AD.students[i].ip,'aetu()')};

// ===== Délégués et sous-délégués (côté délégué) =====
const RL=r=>r==='sous'?'Sous-délégué':'Délégué';
const dchoice=()=>show(`<div class="row"><button class="big" onclick="dreg()">Inscription</button><button class="big" onclick="dlog()">Connexion</button></div>${bk('home')}`);
const dreg=()=>{show(`<h2>Inscription</h2>${f('n','Nom :')}${f('p','Prénom(s) :')}${f('i','I.P :')}${f('k','Code :','password')}${sel2('fn','Fonction',[['delegue','Délégué'],['sous','Sous-délégué']])}<div class="row"><div>${sel('fi','Filière',['MI','PC','SN'])}</div><div>${sel('ni','Niveau',['L1','L2','L3','M1','M2'])}</div></div><button id="b">VALIDER</button><div class="err" id="e"></div>${bk('dchoice')}`);
$('#b').onclick=go(async()=>{await api('dg/register',{nom:v('n'),prenoms:v('p'),ip:v('i'),code:v('k'),role:v('fn'),filiere:v('fi'),niveau:v('ni')});dlog("Inscription réussie. En attendant la validation de l'administrateur, vous êtes considéré comme un étudiant.")})};
const dlog=m=>{show(`<h2>Connexion</h2>${m?`<div class="msg">${m}</div>`:''}${f('i','I.P :')}${f('k','Code :','password')}<button id="b">VALIDER</button><div class="err" id="e"></div>${bk('dchoice')}`);
$('#b').onclick=go(async()=>{const r=await api('login',{ip:v('i'),code:v('k')});T=r.token;const d=r.deleg;
if(d&&d.statut==='valide'){DG=true;dgmenu()}else scan(!d?'':d.statut==='refuse'?"Votre demande de délégué n'a pas été validée.":"En attente de validation : vous êtes considéré comme un étudiant.")})};
const dgmenu=go(async()=>{DM=await api('dg/me');const p=DM.perm,any=p.listes||p.appels;
show(`<h2>${RL(DM.role)} · ${esc(DM.niveau)} ${esc(DM.filiere)}</h2><div class="grid"><div class="item" onclick="scan('','dgmenu')">Scanner ma présence</div>${p.listes?'<div class="item" onclick="dgListes()">Listes de mon niveau</div>':''}${p.appels?'<div class="item" onclick="dgAppels()">Appels de mon niveau</div>':''}</div>${any?'':"<p>Aucune information n'est disponible pour le moment.</p>"}${bk('home','Déconnexion')}`)});
const dgLine=p=>`IP ETUDIANT: ${esc(p.ip)} | NOM: ${esc(p.nom)} | PRENOM(S): ${esc(p.prenoms)}`;
const dgClk=(p,b)=>DM.perm.historique?` data-ip="${esc(p.ip)}" onclick="dgHist(this.dataset.ip,'${b}')"`:'';
const dlDG=()=>dl('liste_'+DGR.niveau+'-'+DGR.filiere+'.csv',[EN()?['I.P','Last name','First name(s)','Attendances','Sessions']:['I.P','Nom','Prénom(s)','Présences','Appels']].concat(DGR.list.map(p=>[p.ip,p.nom,p.prenoms,p.n,DGR.m])));
const dgListes=go(async()=>{const r=await api('dg/listes');DGR=r;show(`<h2>${esc(r.niveau)} ${esc(r.filiere)}</h2><div class="sub">${r.m} appel(s)</div>${r.list.map(p=>`<div class="item"${dgClk(p,'dgListes')}>${dgLine(p)}<br>${p.n} présence(s) sur ${r.m}</div>`).join('')||'<p>Aucun présent.</p>'}<button onclick="dlDG()">Télécharger la liste (CSV)</button>${bk('dgmenu')}`)});
const dgAppels=go(async()=>{DL2=await api('dg/appels');show(`<h2>Appels de mon niveau</h2>${DL2.map((s,i)=>`<div class="item" onclick="dgApp(${i})">${s.date} · ${esc(s.ue)} · ${lab(s)} (${s.n} présents)</div>`).join('')||'<p>Aucun appel enregistré.</p>'}<button onclick="dl('presences_mon-niveau.csv',rowsOf(DL2))">Tout télécharger (CSV)</button>${bk('dgmenu')}`)});
const dgApp=i=>{const s=DL2[i];show(`<h2>${s.date}</h2><div class="sub">${esc(s.ue)} · ${lab(s)}</div>${s.present.map(p=>`<div class="item"${dgClk(p,'dgAppels')}>${dgLine(p)}</div>`).join('')||'<p>Aucun présent.</p>'}<button onclick="dl(fn(DL2[${i}]),rowsOf([DL2[${i}]]))">Télécharger la liste (CSV)</button>${bk('dgAppels')}`)};
const dgHist=go(async(ip,back)=>{const r=await api('dg/hist?ip='+encodeURIComponent(ip));show(`<h2>${esc(r.nom)} ${esc(r.prenoms)}</h2><div class="sub">${esc(r.ip)} · ${r.list.length} présence(s)</div>${r.list.map(s=>`<div class="item s">${s.date} · ${esc(s.ue)} · ${lab(s)}</div>`).join('')||'<p>Aucune présence.</p>'}${bk(back)}`)});
// ===== Administration des délégués =====
const dgS=g=>g.statut==='attente'?'en attente':g.statut==='refuse'?'refusé':'validé comme '+RL(g.valide);
const adel=go(async()=>{await aload();show(`<h2>Délégués et sous-délégués</h2>${AD.deleg.map((g,i)=>`<div class="item s">${esc(g.ip)} | ${esc(g.nom)} ${esc(g.prenoms)}<br>Niveau : ${esc(g.niveau)} ${esc(g.filiere)} · Demande : ${RL(g.role)} · Statut : ${dgS(g)}<br>Inscrit le ${new Date(g.date).toLocaleDateString('fr-FR')} · ${g.n} présence(s)<br>Accès : Listes ${g.perm.listes?'✓':'✗'} · Appels ${g.perm.appels?'✓':'✗'} · Historique ${g.perm.historique?'✓':'✗'}<br><button class="sm" onclick="gVal(${i},'delegue')">Valider Délégué</button><button class="sm" onclick="gVal(${i},'sous')">Valider Sous-délégué</button><button class="sm red" onclick="gRef(${i})">Refuser</button><button class="sm" onclick="gAcc(${i})">Accès</button><button class="sm" onclick="gNiv(${i})">Niveau</button><button class="sm" onclick="gHist(${i})">Historique</button><button class="sm red" onclick="gClr(${i})">Supprimer le code</button><button class="sm red" onclick="gDel(${i})">Supprimer</button><button class="sm red" onclick="gPur(${i})">Effacer définitivement</button></div>`).join('')||'<p>Aucun délégué.</p>'}${bk('amenu')}`)});
const gVal=go(async(i,r)=>{await A_('dg/validate',{ip:AD.deleg[i].ip,role:r});adel()});
const gRef=go(async i=>{await A_('dg/refuse',{ip:AD.deleg[i].ip});adel()});
const gNiv=go(async i=>{const g=AD.deleg[i],n=prompt('Niveau (L1, L2, L3, M1, M2) :',g.niveau);if(!n)return;const f=prompt('Filière (MI, PC, SN) :',g.filiere);if(!f)return;await A_('dg/update',{ip:g.ip,niveau:n.toUpperCase(),filiere:f.toUpperCase()});adel()});
const gHist=i=>{LD=AD.sessions;hist(AD.deleg[i].ip,'adel()')};
const gClr=go(async i=>{if(!confirm("Supprimer le code de ce profil ? Il ne pourra plus se connecter tant qu'un nouveau code n'est pas défini (Étudiants > Mot de passe)."))return;await A_('dg/clearcode',{ip:AD.deleg[i].ip});adel()});
const gDel=go(async i=>{if(!confirm('Supprimer ce profil ? Il ira dans la corbeille (récupérable).'))return;await A_('student/delete',{ip:AD.deleg[i].ip});adel()});
const gPur=go(async i=>{if(!confirm('Effacer définitivement ce profil de la base de données ? Impossible à annuler.'))return;await A_('dg/purge',{ip:AD.deleg[i].ip});adel()});
const gAcc=i=>{const g=AD.deleg[i];show(`<h2>${esc(g.nom)} ${esc(g.prenoms)}</h2>${[['listes','Listes des étudiants'],['appels','Appels du niveau'],['historique',"Historique d'un étudiant"]].map(x=>`<button onclick="gPerm(${i},'${x[0]}',${!g.perm[x[0]]})">${x[1]} : ${g.perm[x[0]]?'autorisé':'bloqué'}</button>`).join('')}<button class="red" onclick="gPerm(${i},'all',false)">Tout bloquer</button><button onclick="gPerm(${i},'all',true)">Tout autoriser</button>${bk('adel')}`)};
const gPerm=go(async(i,k,v)=>{await A_('dg/perm',{ip:AD.deleg[i].ip,key:k,value:v});await aload();gAcc(i)});

// ===== Administration =====
const A_=(p,b)=>api('adm/'+p,b||{});
const aload=async()=>{AD=await A_('data')};
const amenu=go(async()=>{await aload();show(`<h2>Administration</h2><div class="grid"><div class="item" onclick="aetu()">Étudiants (${AD.students.length})</div><div class="item" onclick="aapp()">Appels (${AD.sessions.length})</div><div class="item" onclick="aue()">UE et codes Docteur (${AD.ues.length})</div><div class="item" onclick="acorb()">Corbeille (${AD.trash.students.length+AD.trash.sessions.length+AD.trash.ues.length})</div><div class="item" onclick="adel()">Délégués et sous-délégués (${AD.deleg.length})${AD.deleg.some(g=>g.statut==='attente')?` <b style="color:#b00020">· ${AD.deleg.filter(g=>g.statut==='attente').length} en attente</b>`:''}</div><div class="item" onclick="lvlOpen(1)">Listes par niveau</div><div class="item" onclick="acfg()">Codes d'accès</div></div>${bk('home','Déconnexion')}`)});
const dlStu=()=>{const G={};AD.deleg.forEach(g=>G[g.ip]=g);dl('etudiants.csv',[EN()?['I.P','Last name','First name(s)','Role','Status','Level','Field']:['I.P','Nom','Prénom(s)','Fonction','Statut','Niveau','Filière']].concat(AD.students.map(s=>{const g=G[s.ip];return[s.ip,s.nom,s.prenoms,g?RL(g.valide||g.role):'',g?dgS(g):'',g?g.niveau:'',g?g.filiere:'']})))};
const aetu=go(async()=>{await aload();show(`<h2>Étudiants</h2>${AD.students.map((s,i)=>`<div class="item s">${esc(s.ip)} | ${esc(s.nom)} ${esc(s.prenoms)}<br><button class="sm" onclick="eEdit(${i})">Modifier</button><button class="sm" onclick="ePw(${i})">Mot de passe</button><button class="sm" onclick="eHist(${i})">Historique</button><button class="sm red" onclick="eDel(${i})">Supprimer</button></div>`).join('')||'<p>Aucun étudiant.</p>'}<button onclick="dlStu()">Télécharger la liste des étudiants (CSV)</button>${bk('amenu')}`)});
const eEdit=go(async i=>{const s=AD.students[i],n=prompt('Nom :',s.nom);if(n===null)return;const p=prompt('Prénom(s) :',s.prenoms);if(p===null)return;await A_('student/update',{ip:s.ip,nom:n,prenoms:p});aetu()});
const ePw=go(async i=>{const k=prompt('Nouveau code pour '+AD.students[i].ip+' :');if(!k)return;await A_('student/update',{ip:AD.students[i].ip,code:k});alert('Code modifié.')});
const eDel=go(async i=>{if(!confirm('Supprimer ce profil ? Il ira dans la corbeille (récupérable).'))return;await A_('student/delete',{ip:AD.students[i].ip});aetu()});
const aapp=go(async()=>{await aload();show(`<h2>Appels</h2>${AD.sessions.map((s,i)=>`<div class="item" onclick="asess(${i})">${s.date} · ${esc(s.ue)} · ${lab(s)} (${s.n} présents)</div>`).join('')||'<p>Aucun appel.</p>'}<button onclick="dl('presences_toutes.csv',rowsOf(AD.sessions))">Télécharger tous les appels (CSV)</button>${bk('amenu')}`)});
const asess=i=>{const s=AD.sessions[i];show(`<h2>${s.date}</h2><div class="sub">${esc(s.ue)} · ${lab(s)}</div>${s.present.map((p,j)=>`<div class="item s">${esc(p.ip)} | ${esc(p.nom)} ${esc(p.prenoms)}<br><button class="sm red" onclick="pRem(${i},${j})">Retirer</button></div>`).join('')||'<p>Aucun présent.</p>'}<button onclick="dl(fn(AD.sessions[${i}]),rowsOf([AD.sessions[${i}]]))">Télécharger cet appel (CSV)</button><button onclick="pAdd(${i})">Ajouter un étudiant (I.P)</button><button class="red" onclick="sDel(${i})">Supprimer cet appel</button>${bk('aapp')}`)};
const pRem=go(async(i,j)=>{await A_('presence/remove',{id:AD.sessions[i].id,ip:AD.sessions[i].present[j].ip});await aload();asess(i)});
const pAdd=go(async i=>{const ip=prompt("I.P de l'étudiant à ajouter :");if(!ip)return;await A_('presence/add',{id:AD.sessions[i].id,ip});await aload();asess(i)});
const sDel=go(async i=>{if(!confirm("Supprimer cet appel ? Il ira dans la corbeille."))return;await A_('session/delete',{id:AD.sessions[i].id});aapp()});
const acorb=go(async()=>{await aload();const t=AD.trash;show(`<h2>Corbeille</h2><h3>Profils supprimés</h3>${t.students.map((s,i)=>`<div class="item s">${esc(s.ip)} | ${esc(s.nom)} ${esc(s.prenoms)}<br><button class="sm" onclick="tAct('student/restore',${i},0)">Restaurer</button><button class="sm red" onclick="tAct('student/purge',${i},0)">Supprimer définitivement</button></div>`).join('')||'<p>Aucun.</p>'}<h3>UE supprimées</h3>${t.ues.map((u,i)=>`<div class="item s">${esc(u.nom)}<br><button class="sm" onclick="tAct('ue/restore',${i},2)">Restaurer</button><button class="sm red" onclick="tAct('ue/purge',${i},2)">Supprimer définitivement</button></div>`).join('')||'<p>Aucune.</p>'}<h3>Appels supprimés</h3>${t.sessions.map((s,i)=>`<div class="item s">${s.date} · ${esc(s.ue)} · ${lab(s)} (${s.n} présents)<br><button class="sm" onclick="tAct('session/restore',${i},1)">Restaurer</button><button class="sm red" onclick="tAct('session/purge',${i},1)">Supprimer définitivement</button></div>`).join('')||'<p>Aucun.</p>'}${bk('amenu')}`)});
const tAct=go(async(a,i,k)=>{if(a.endsWith('purge')&&!confirm('Suppression définitive : impossible à annuler. Continuer ?'))return;
const o=[AD.trash.students,AD.trash.sessions,AD.trash.ues][k][i];await A_(a,k?{id:o.id}:{ip:o.ip});acorb()});
const aue=go(async()=>{await aload();show(`<h2>UE et codes Docteur</h2>${AD.ues.map((u,i)=>`<div class="item s"><b>${esc(u.nom)}</b> · appel ${u.actif?'autorisé':'<span style="color:#b00020">bloqué</span>'} · listes ${u.listes?'autorisées':'<span style="color:#b00020">bloquées</span>'}<br><button class="sm" onclick="uNom(${i})">Renommer</button><button class="sm" onclick="uCode(${i})">Code</button><button class="sm" onclick="uTog(${i})">${u.actif?'Bloquer':'Autoriser'} l'appel</button><button class="sm" onclick="uLst(${i})">${u.listes?'Bloquer':'Autoriser'} les listes</button><button class="sm red" onclick="uDel(${i})">Supprimer</button></div>`).join('')||'<p>Aucune UE.</p>'}<button onclick="uAdd()">Ajouter une UE</button>${bk('amenu')}`)});
const uAdd=go(async()=>{const n=prompt("Nom de l'UE :");if(!n)return;const c=prompt('Code Docteur de cette UE (6 caractères minimum) :');if(!c)return;await A_('ue/add',{nom:n,code:c});aue()});
const uNom=go(async i=>{const n=prompt('Nouveau nom :',AD.ues[i].nom);if(!n)return;await A_('ue/update',{id:AD.ues[i].id,nom:n});aue()});
const uCode=go(async i=>{const c=prompt('Nouveau code pour '+AD.ues[i].nom+' :');if(!c)return;await A_('ue/update',{id:AD.ues[i].id,code:c});alert('Code modifié.')});
const uTog=go(async i=>{await A_('ue/update',{id:AD.ues[i].id,actif:!AD.ues[i].actif});aue()});
const uLst=go(async i=>{await A_('ue/update',{id:AD.ues[i].id,listes:!AD.ues[i].listes});aue()});
const uDel=go(async i=>{if(!confirm('Supprimer cette UE ? Elle ira dans la corbeille.'))return;await A_('ue/delete',{id:AD.ues[i].id});aue()});
const acfg=()=>show(`<h2>Codes d'accès</h2><button onclick="cSet('admin')">Changer le code Administrateur</button>${bk('amenu')}`);
const cSet=go(async k=>{const c=prompt('Nouveau code (6 caractères minimum) :');if(!c)return;await A_('config',{[k]:c});alert('Code modifié.')});
home();
</script>
<script src="/i18n.js"></script></body></html>
